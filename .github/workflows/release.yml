name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to publish (for example, v1.2.3)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Verify release source
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          tag_refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$tag_refs" ]]; then
            tagged_commit=$(printf '%s\n' "$tag_refs" | tail -n 1 | cut -f 1)
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $RELEASE_TAG points to a different commit. Choose a new tag or run the workflow from the matching tag."
              exit 1
            fi
          fi
      - run: npm run check

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            architecture: x64
          - name: Windows
            runner: windows-2025
            platform: win
            architecture: x64
          - name: Linux
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.architecture }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:release -- ${{ matrix.platform }} ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: stickmations-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stickmations-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_COMMIT" \
              --notes "Desktop installers for Stickmations ${RELEASE_TAG#v}. Source code: https://github.com/${GH_REPO}/tree/${RELEASE_COMMIT}. Free for personal, non-commercial use. Commercial use requires a paid license; see LICENSE in the source code." \
              --title "Stickmations ${RELEASE_TAG#v}"
          fi
