<header class="flex h-8 shrink-0 items-center border-b border-[#414141] bg-[#232323] px-2.5">
  <div class="flex min-w-0 items-center gap-2">
    <img
      ngSrc="assets/app_logo_40.png"
      width="20"
      height="20"
      alt=""
      priority
      class="size-5 rounded-[4px] object-cover"
    />
    <h1 class="truncate text-[12px] font-semibold text-[#DADADA]">{{ title() }}</h1>
    <span class="hidden text-[#666666] sm:inline">/</span>
    <span class="hidden truncate text-[10px] text-[#9A9A9A] sm:inline">{{ projectName() }}</span>
  </div>
  <nav
    class="ml-5 hidden h-full items-stretch text-[10px] text-[#B0B0B0] lg:flex"
    aria-label="Application menu"
  >
    <details class="editor-menu" name="application-menu">
      <summary>File</summary>
      <div class="editor-menu-panel w-52">
        <button type="button" (click)="blankProjectRequested.emit(); closeMenu($event)">
          <svg lucideFilePlusCorner size="13"></svg><span>New blank animation</span>
        </button>
        <button type="button" (click)="figureEditorRequested.emit(); closeMenu($event)">
          <svg lucideFilePlusCorner size="13"></svg><span>New stick figure…</span>
        </button>
        <label
          ><svg lucideUpload size="13"></svg><span>Import existing project…</span
          ><input
            type="file"
            class="sr-only"
            accept=".stickmation,application/gzip"
            (change)="selectProject($event)"
        /></label>
        <label
          ><svg lucideUpload size="13"></svg><span>Import stick figures…</span
          ><input
            type="file"
            class="sr-only"
            multiple
            accept="application/json,.json,.nodes"
            (change)="selectFiles($event)"
        /></label>
        <label
          ><svg lucideImage size="13"></svg><span>Import background…</span
          ><input
            type="file"
            class="sr-only"
            accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.bmp,.ico"
            (change)="selectBackground($event)"
        /></label>
        <div class="editor-menu-separator"></div>
        <button
          type="button"
          [disabled]="!canSaveProject()"
          (click)="projectSaveRequested.emit(); closeMenu($event)"
        >
          <svg lucideSave size="13"></svg><span>Save project…</span><kbd>⌘S</kbd>
        </button>
        <button
          type="button"
          [disabled]="!canExportMp4()"
          (click)="mp4ExportRequested.emit(); closeMenu($event)"
        >
          <svg lucideDownload size="13"></svg><span>Export MP4…</span><kbd>⌘E</kbd>
        </button>
      </div>
    </details>
    <details class="editor-menu" name="application-menu">
      <summary>Edit</summary>
      <div class="editor-menu-panel w-48">
        <button type="button" [disabled]="!canUndo()" (click)="undo.emit(); closeMenu($event)">
          <svg lucideUndo2 size="13"></svg><span>Undo</span><kbd>⌘Z</kbd>
        </button>
        <button type="button" [disabled]="!canRedo()" (click)="redo.emit(); closeMenu($event)">
          <svg lucideRedo2 size="13"></svg><span>Redo</span><kbd>⇧⌘Z</kbd>
        </button>
        <div class="editor-menu-separator"></div>
        <button
          type="button"
          [disabled]="!selectedFigureName()"
          (click)="selectedFigureDeleted.emit(); closeMenu($event)"
        >
          <svg lucideX size="13"></svg><span>Delete selected figure</span>
        </button>
      </div>
    </details>
    <details class="editor-menu" name="application-menu">
      <summary>View</summary>
      <div class="editor-menu-panel w-52">
        <button type="button" (click)="zoomIn.emit(); closeMenu($event)">
          <svg lucideZoomIn size="13"></svg><span>Zoom in</span><kbd>{{ zoom() }}%</kbd>
        </button>
        <button type="button" (click)="zoomOut.emit(); closeMenu($event)">
          <svg lucideZoomOut size="13"></svg><span>Zoom out</span>
        </button>
        <button type="button" (click)="fitCanvas.emit(); closeMenu($event)">
          <svg lucideMaximize2 size="13"></svg><span>Fit canvas</span>
        </button>
        <button type="button" (click)="controlModeChange.emit('pan'); closeMenu($event)">
          <svg lucideHand size="13"></svg><span>Hand tool</span>
        </button>
        <button type="button" (click)="controlModeChange.emit('camera'); closeMenu($event)">
          <svg lucideCamera size="13"></svg><span>Camera tool</span>
        </button>
        <button type="button" (click)="panRequested.emit({ x: -40, y: 0 }); closeMenu($event)">
          <svg lucideChevronLeft size="13"></svg><span>Pan left</span>
        </button>
        <button type="button" (click)="panRequested.emit({ x: 40, y: 0 }); closeMenu($event)">
          <svg lucideChevronRight size="13"></svg><span>Pan right</span>
        </button>
        <div class="editor-menu-separator"></div>
        <button
          type="button"
          (click)="
            controlModeChange.emit(controlMode() === 'joints' ? 'none' : 'joints');
            closeMenu($event)
          "
        >
          <svg lucideBone size="13"></svg
          ><span>{{
            controlMode() === 'joints' ? 'Hide joint controls' : 'Show joint controls'
          }}</span>
        </button>
        <div class="editor-menu-separator"></div>
        <label class="workspace-menu-item"
          ><input type="checkbox" [checked]="onion.enabled()" (change)="toggleOnion($event)" /><span
            >Onion skins</span
          ></label
        >
        @if (onion.enabled()) {
          <label class="workspace-menu-item"
            ><span>Frames before</span
            ><input
              type="number"
              min="0"
              [max]="onion.maxFrames"
              class="onion-count"
              [value]="onion.before()"
              (change)="changeOnionBefore($event)"
          /></label>
          <label class="workspace-menu-item"
            ><span>Frames after</span
            ><input
              type="number"
              min="0"
              [max]="onion.maxFrames"
              class="onion-count"
              [value]="onion.after()"
              (change)="changeOnionAfter($event)"
          /></label>
        }
        <div class="editor-menu-separator"></div>
        <label class="workspace-menu-item"
          ><input
            type="checkbox"
            [checked]="workspace.isVisible('project')"
            (change)="togglePanel('project', $event)"
          /><span>Project / Outliner</span></label
        >
        <label class="workspace-menu-item"
          ><input
            type="checkbox"
            [checked]="workspace.isVisible('sceneStrip')"
            (change)="togglePanel('sceneStrip', $event)"
          /><span>Scene Strip</span></label
        >
        <label class="workspace-menu-item"
          ><input
            type="checkbox"
            [checked]="workspace.isVisible('timeline')"
            (change)="togglePanel('timeline', $event)"
          /><span>Timeline</span></label
        >
        <label class="workspace-menu-item"
          ><input
            type="checkbox"
            [checked]="workspace.isVisible('inspector')"
            (change)="togglePanel('inspector', $event)"
          /><span>Properties</span></label
        >
        <div class="editor-menu-separator"></div>
        <button type="button" (click)="workspace.focusCanvas(); closeMenu($event)">
          <span>Focus Canvas</span>
        </button>
        <button type="button" (click)="workspace.reset(); closeMenu($event)">
          <span>Reset Workspace</span>
        </button>
      </div>
    </details>
    <details class="editor-menu" name="application-menu">
      <summary>Animation</summary>
      <div class="editor-menu-panel w-52">
        <button
          type="button"
          [disabled]="currentFrame() <= 1"
          (click)="previousFrame.emit(); closeMenu($event)"
        >
          <svg lucideChevronLeft size="13"></svg><span>Previous frame</span>
        </button>
        <button
          type="button"
          [disabled]="currentFrame() >= totalFrames()"
          (click)="nextFrame.emit(); closeMenu($event)"
        >
          <svg lucideChevronRight size="13"></svg><span>Next frame</span>
        </button>
        <div class="editor-menu-separator"></div>
        <button
          type="button"
          [disabled]="totalFrames() === 0"
          (click)="frameAdded.emit(); closeMenu($event)"
        >
          <svg lucideCopyPlus size="13"></svg><span>Duplicate frame</span>
        </button>
        <button type="button" (click)="blankFrameAdded.emit(); closeMenu($event)">
          <svg lucideFilePlusCorner size="13"></svg><span>Add blank frame</span>
        </button>
        <button
          type="button"
          [disabled]="totalFrames() <= 1"
          (click)="frameDeleted.emit(); closeMenu($event)"
        >
          <svg lucideX size="13"></svg><span>Delete frame</span>
        </button>
      </div>
    </details>
    <details class="editor-menu" name="application-menu">
      <summary>Help</summary>
      <div class="editor-menu-panel w-44">
        <button type="button" (click)="informationOpen.set('help'); closeMenu($event)">
          <svg lucideCircleHelp size="13"></svg><span>Help &amp; bug reports</span>
        </button>
        <a
          [href]="links.news"
          target="_blank"
          rel="noopener noreferrer"
          (click)="closeMenu($event)"
        >
          <svg lucideNewspaper size="13"></svg><span>What's new</span>
        </a>
      </div>
    </details>
    <details class="editor-menu" name="application-menu">
      <summary>About Us</summary>
      <div class="editor-menu-panel w-44">
        <button type="button" (click)="informationOpen.set('about'); closeMenu($event)">
          <svg lucideInfo size="13"></svg><span>About Stickmations</span>
        </button>
      </div>
    </details>
  </nav>
  <div class="ml-auto flex items-center gap-1">
    <button
      type="button"
      class="menu-bar-icon"
      aria-label="Export MP4"
      title="Export MP4"
      [disabled]="!canExportMp4()"
      (click)="mp4ExportRequested.emit()"
    >
      <svg lucideDownload size="15"></svg></button
    ><button
      type="button"
      class="menu-bar-icon"
      aria-label="Save project"
      title="Save project"
      [disabled]="!canSaveProject()"
      (click)="projectSaveRequested.emit()"
    >
      <svg lucideSave size="15"></svg></button
    ><a
      class="menu-bar-icon"
      aria-label="What's new"
      title="What's new"
      [href]="links.news"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg lucideNewspaper size="15"></svg></a
    ><button
      type="button"
      class="menu-bar-icon"
      aria-label="Help and bug reports"
      title="Help and bug reports"
      (click)="informationOpen.set('help')"
    >
      <svg lucideCircleHelp size="15"></svg></button
    ><button
      type="button"
      class="menu-bar-icon"
      aria-label="About Stickmations"
      title="About Stickmations"
      (click)="informationOpen.set('about')"
    >
      <svg lucideInfo size="15"></svg>
    </button>
  </div>
</header>
@if (informationOpen(); as view) {
  <app-application-info-dialog [view]="view" (closed)="informationOpen.set(null)" />
}
